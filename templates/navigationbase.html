
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hospital Management System{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        :root {
            --primary: #102a43;
            --primary-light: #183e5c;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --background: #f4f7fb;
            --text: #334155;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Navigation */
        .main-navbar {
            background: linear-gradient(
                110deg,
                var(--primary),
                var(--primary-light)
            );
            padding: 14px 5%;
            box-shadow: 0 4px 16px rgba(15, 39, 71, 0.15);
        }

        .main-navbar .navbar-brand {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .brand-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            margin-right: 12px;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 20px;
        }

        .main-navbar .navbar-nav .nav-link {
            color: #dbeafe;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 17px;
            margin-left: 5px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }

        .main-navbar .navbar-nav .nav-link:hover,
        .main-navbar .navbar-nav .nav-link.active {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .main-navbar .navbar-toggler {
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 7px 10px;
            outline: none;
        }

        /* Main page content */
        .main-content {
            flex: 1;
            width: 100%;
            padding-top: 28px;
            padding-bottom: 35px;
        }

        /* Footer */
        .main-footer {
            margin-top: auto;
            background: #0b192b;
            color: #cbd5e1;
            padding: 32px 20px 18px;
        }

        .footer-brand {
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .footer-description {
            max-width: 440px;
            margin: 0 auto 18px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
        }

        .footer-social {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 24px;
        }

        .footer-social a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            border: 1px solid #334155;
            border-radius: 50%;
            background: #152940;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 17px;
            transition: all 0.25s ease;
        }

        .footer-social a:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-3px);
        }

        .footer-divider {
            border-color: #26374a;
            margin: 20px 0 15px;
        }

        .footer-copyright {
            color: #94a3b8;
            font-size: 12px;
            margin: 0;
        }

        .footer-copyright span {
            color: #5eead4;
            font-weight: 600;
        }

        @media (max-width: 767px) {
            .main-navbar {
                padding: 12px 16px;
            }

            .main-navbar .navbar-brand {
                font-size: 16px;
            }

            .brand-icon {
                width: 36px;
                height: 36px;
                font-size: 17px;
                margin-right: 9px;
            }

            .main-navbar .navbar-nav {
                padding-top: 12px;
            }

            .main-navbar .navbar-nav .nav-link {
                margin: 3px 0;
                padding: 11px 12px;
            }

            .main-content {
                padding-top: 18px;
                padding-bottom: 25px;
            }

            .main-footer {
                padding: 26px 16px 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
        <a class="navbar-brand" href="{% url 'index' %}">
            <span class="brand-icon">
                <i class="fas fa-hospital-alt"></i>
            </span>
            <span>Hospital Management System</span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
                       href="{% url 'index' %}">
                        <i class="fas fa-home mr-1"></i> Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                       href="{% url 'contact' %}">
                        <i class="fas fa-envelope mr-1"></i> Contact
                    </a>
                </li>

            </ul>
        </div>
    </nav>

    <!-- Page content -->
    <main class="main-content">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container text-center">

            <div class="footer-brand">
                <i class="fas fa-heartbeat mr-2"></i>
                Hospital Management System
            </div>

            <p class="footer-description">
                Supporting better healthcare through organized patient
                management, medical services, and hospital administration.
            </p>

            <div class="footer-social">
                <a href="https://www.facebook.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>

                <a href="https://www.whatsapp.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>

                <a href="https://www.instagram.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>

                <a href="https://twitter.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
            </div>

            <hr class="footer-divider">

            <p class="footer-copyright">
                &copy; {% now "Y" %} Developed by
                <span>Akhil</span>. All rights reserved.
            </p>

        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.4.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
