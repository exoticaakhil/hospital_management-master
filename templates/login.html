
{% extends 'nav3.html' %}
{% load static %}

{% block content %}

<style>
  :root {
    --medical-blue: #1769aa;
    --medical-dark: #123653;
    --medical-green: #20a486;
    --medical-bg: #f1f6fb;
  }

  body {
    background: var(--medical-bg);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .login-page {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px 15px;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 45px rgba(18, 54, 83, .12);
    border: 1px solid #e6edf4;
  }

  .login-header {
    background: linear-gradient(135deg, #123653, #1769aa);
    color: #fff;
    padding: 32px 25px;
    text-align: center;
  }

  .login-logo {
    height: 72px;
    width: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, .15);
    font-size: 2.5rem;
  }

  .login-header h2 {
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .login-header p {
    color: #dceaf5;
    font-size: .95rem;
    margin-bottom: 0;
  }

  .login-body {
    padding: 30px;
  }

  .welcome-title {
    color: var(--medical-dark);
    font-size: 1.35rem;
    font-weight: 750;
    margin-bottom: 8px;
  }

  .welcome-text {
    color: #758599;
    font-size: .92rem;
    margin-bottom: 25px;
  }

  .form-label {
    font-weight: 650;
    color: #344b60;
    margin-bottom: 8px;
  }

  .input-group-custom {
    display: flex;
    align-items: center;
    border: 1px solid #dce5ee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    background: #fff;
    transition: border-color .2s, box-shadow .2s;
  }

  .input-group-custom:focus-within {
    border-color: var(--medical-blue);
    box-shadow: 0 0 0 3px rgba(23, 105, 170, .10);
  }

  .input-icon {
    color: #8293a5;
    padding: 0 13px;
    font-size: 1.15rem;
  }

  .input-group-custom input {
    width: 100%;
    min-width: 0;
    padding: 13px 12px 13px 0;
    border: none;
    outline: none;
    background: transparent;
    color: #263b4f;
  }

  .input-group-custom input::placeholder {
    color: #a0adba;
  }

  .password-toggle {
    border: none;
    background: transparent;
    color: #718397;
    padding: 10px 13px;
    cursor: pointer;
  }

  .login-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 24px;
    font-size: .88rem;
  }

  .remember-label {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #657589;
  }

  .remember-label input {
    accent-color: var(--medical-blue);
  }

  .login-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    color: #fff;
    background: var(--medical-blue);
    font-weight: 700;
    font-size: 1rem;
    transition: background .2s, transform .2s;
  }

  .login-button:hover {
    background: var(--medical-dark);
    transform: translateY(-1px);
  }

  .cancel-button {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    text-align: center;
    text-decoration: none;
    border: 1px solid #dce5ee;
    border-radius: 10px;
    color: #526477;
    background: #fff;
    font-weight: 600;
  }

  .cancel-button:hover {
    background: #f4f7fa;
    color: var(--medical-dark);
  }

  .login-footer {
    background: #f8fafc;
    border-top: 1px solid #edf1f5;
    text-align: center;
    padding: 17px;
    color: #78899a;
    font-size: .85rem;
  }

  .login-footer i {
    color: var(--medical-green);
    margin-right: 5px;
  }

  @media (max-width: 480px) {
    .login-page {
      padding: 25px 12px;
    }

    .login-body {
      padding: 24px 20px;
    }

    .login-header {
      padding: 27px 20px;
    }

    .login-options {
      flex-wrap: wrap;
    }
  }
</style>

<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <i class="bi bi-hospital"></i>
      </div>
      <h2>MAK Hospital</h2>
      <p>Hospital Management Portal</p>
    </div>

    <!-- Login Form -->
    <div class="login-body">
      <h4 class="welcome-title">Welcome Back!</h4>
      <p class="welcome-text">
        Please sign in to access your hospital account.
      </p>

      <form action="" method="post">
        {% csrf_token %}

        <label for="uname" class="form-label">Username</label>
        <div class="input-group-custom">
          <span class="input-icon">
            <i class="bi bi-person"></i>
          </span>
          <input
            type="text"
            id="uname"
            name="uname"
            placeholder="Enter your username"
            autocomplete="username"
            required>
        </div>

        <label for="pwd" class="form-label">Password</label>
        <div class="input-group-custom">
          <span class="input-icon">
            <i class="bi bi-lock"></i>
          </span>
          <input
            type="password"
            id="pwd"
            name="pwd"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button type="button"
                  class="password-toggle"
                  id="togglePassword"
                  aria-label="Show password"
                  aria-pressed="false">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" name="remember_me">
            Remember me
          </label>
        </div>

        <button type="submit" class="login-button">
          <i class="bi bi-box-arrow-in-right me-2"></i>
          Sign In
        </button>

        <a href="{% url 'login' %}" class="cancel-button">
          Cancel
        </a>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <i class="bi bi-shield-check"></i>
      Secure Hospital Portal
    </div>

  </div>
</div>

<script>
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("pwd");
  const eyeIcon = document.getElementById("eyeIcon");

  togglePassword.addEventListener("click", function () {
    const isPassword = passwordInput.type === "password";

    passwordInput.type = isPassword ? "text" : "password";
    eyeIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";

    togglePassword.setAttribute(
      "aria-label",
      isPassword ? "Hide password" : "Show password"
    );

    togglePassword.setAttribute("aria-pressed", String(isPassword));
  });
</script>

{% if error %}
<script>
    window.onload = function () {
        alert("{{ error|escapejs }}");
    };
</script>
{% endif %}

{% endblock %}
